# ============================================================
# Bin Tracker — Plug-and-Play Configuration
# ============================================================

camera:
  source: 0                    # 0 = default webcam, or path to video / RTSP URL
  width: 1280
  height: 720
  fps: 30

# --- Bin Boundary Detector (Initialization) ------------------
bin_detector:
  model_path: "models/bin_segmentation.pt"   # YOLO .pt weights
  confidence_threshold: 0.5
  iou_threshold: 0.45
  device: "cpu"                              # "cpu" or "cuda:0"
  snapshot_on_startup: true                  # take one frame, detect bins, lock coords

# --- Hand Tracker (Plug-and-Play) ----------------------------
hand_tracker:
  backend: "mediapipe"          # swap to any registered backend name
  confidence_threshold: 0.5
  max_hands: 2

# --- Bin Assignment Engine -----------------------------------
bin_assignment:
  method: "point_in_polygon"    # or "nearest_centroid"
  hand_keypoint: "index_tip"    # which hand landmark to use as the "reaching" point

# --- UI / Visualization -------------------------------------
ui:
  enabled: true
  show_bin_boundaries: true
  show_hand_landmarks: true
  highlight_active_bin: true
  overlay_alpha: 0.35
  window_name: "Bin Tracker"

# --- Logging -------------------------------------------------
logging:
  level: "INFO"                 # DEBUG | INFO | WARNING | ERROR
  log_file: "logs/bin_tracker.log"
